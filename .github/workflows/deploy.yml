name: Deploy Website to GitHub Pages

on:
  # รันกระบวนการเมื่อมีการ Push โค้ดลง branch main
  push:
    branches:
      - main # หาก repository ของคุณใช้ชื่อ master ให้เปลี่ยนเป็น master

# กำหนดสิทธิ์การเข้าถึงให้ GitHub Actions สามารถเขียนข้อมูลไปยัง GitHub Pages ได้
permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกันการรัน Deployment ซ้อนกันในเวลาเดียวกัน
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. ดึงโค้ดจาก Repository มาไว้ที่ Runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ตั้งค่าระบบ GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. อัปโหลดไฟล์เพื่อเตรียม Deploy
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ระบุตำแหน่งโฟลเดอร์ของไฟล์เว็บ
          # ใส่ '.' หมายถึงโฟลเดอร์หลัก (Root)
          # หากไฟล์เว็บอยู่ในโฟลเดอร์อื่น ให้เปลี่ยน เช่น './public' หรือ './dist'
          path: './docs'

      # 4. ส่งไฟล์ขึ้น GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
